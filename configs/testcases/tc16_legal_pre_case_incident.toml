# Tests whether council routes pre-Lorelai-birth incident report to Legal/01_Infant
[testcase]
id = "TC-16"
name = "Pre-case police report routing — stage assignment for pre-birth evidence"
corpus = "intake_routing_qa"
document = "t16_routing.md"
